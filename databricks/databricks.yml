bundle:
  name: retail-analytics-pipeline

workspace:
  host: https://dbc-8530e3b4-87c9.cloud.databricks.com

targets:
  dev:
    mode: development
    workspace:
      root_path: /Users/${workspace.current_user.userName}/bundles/${bundle.name}/${bundle.target}
    
  prod:
    mode: production
    workspace:
      root_path: /Shared/bundles/${bundle.name}

resources:
  jobs:
    retail_data_pipeline:
      name: "Retail Analytics Pipeline - ${bundle.target}"
      job_clusters:
        - job_cluster_key: main
          new_cluster:
            spark_version: "13.3.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 2
      tasks:
        - task_key: bronze_ingestion
          job_cluster_key: main
          notebook_task:
            notebook_path: ./notebooks/01_data_ingestion
            base_parameters:
              env: ${bundle.target}
        - task_key: silver_transformation
          job_cluster_key: main
          notebook_task:
            notebook_path: ./notebooks/02_bronze_to_silver
            base_parameters:
              env: ${bundle.target}
          depends_on:
            - task_key: bronze_ingestion
        - task_key: gold_aggregation
          job_cluster_key: main
          notebook_task:
            notebook_path: ./notebooks/03_silver_to_gold
            base_parameters:
              env: ${bundle.target}
          depends_on:
            - task_key: silver_transformation

  notebooks:
    data_ingestion:
      path: ./notebooks/01_data_ingestion.py
    bronze_to_silver:
      path: ./notebooks/02_bronze_to_silver.py
    silver_to_gold:
      path: ./notebooks/03_silver_to_gold.py
